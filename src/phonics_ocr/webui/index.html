<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonics Prism — OCR</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c2230; --line:#272e3b;
    --ink:#e8edf5; --muted:#8b97ab; --accent:#4f8cff; --accent-2:#2a5db0;
    --ok:#3fb950; --warn:#d29922; --bad:#f06060;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:linear-gradient(90deg,#141a24,#10141b);
    border-bottom:1px solid var(--line); flex:none;
  }
  .logo{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:conic-gradient(from 210deg,#4f8cff,#9b6cff,#ff7ab6,#ffd166,#4f8cff);
  }
  .title{font-size:18px;font-weight:650;letter-spacing:.2px}
  .subtitle{font-size:12px;color:var(--muted);margin-top:1px}
  .spacer{flex:1}
  .badge{
    font-size:11px;padding:4px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);background:#121722;
  }
  .badge.on{color:var(--ok);border-color:#1f4d2b;background:#102416}

  main{flex:1; display:grid; grid-template-columns:1fr 420px; min-height:0}
  @media (max-width:980px){ main{grid-template-columns:1fr; grid-template-rows:1fr auto} }

  .stage{
    position:relative; background:#05070b; display:flex;
    align-items:center; justify-content:center; overflow:hidden; min-height:0;
  }
  .stage .hint{position:absolute;color:var(--muted);font-size:14px;text-align:center;padding:20px}

  /* The viewport IS the page aperture: an A5-shaped box with
     overflow:hidden. The video inside is object-fit:cover, so the
     browser scales the frame up and clips everything outside the A5
     rectangle -- the room, and whoever is sitting behind the page, is
     never drawn at all. grab() crops the same rectangle, so what you
     see is exactly what the model gets. Its pixel size is set from JS
     rather than CSS aspect-ratio, because the box is over-constrained
     (height + ratio + both maxima) and browsers resolve that
     inconsistently. */
  .viewport{
    position:relative; overflow:hidden; background:#05070b; flex:none;
    border-radius:7px; outline:1px solid rgba(79,140,255,.45);
    box-shadow:0 14px 48px rgba(0,0,0,.65);
  }
  .viewport video,.viewport img{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }
  .viewport video{object-fit:cover}
  .viewport img{object-fit:contain}
  .viewport b{position:absolute;width:20px;height:20px;border:2px solid rgba(79,140,255,.75)}
  .viewport .k1{top:6px;left:6px;border-right:0;border-bottom:0}
  .viewport .k2{top:6px;right:6px;border-left:0;border-bottom:0}
  .viewport .k3{bottom:6px;left:6px;border-right:0;border-top:0}
  .viewport .k4{bottom:6px;right:6px;border-left:0;border-top:0}

  .hud{
    position:absolute; inset-inline-start:12px; top:12px;
    display:flex; gap:8px; flex-wrap:wrap; pointer-events:none;
  }
  .chip{
    font-size:11px;padding:4px 9px;border-radius:7px;
    background:rgba(8,11,16,.82);border:1px solid var(--line);color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}


  .controls{
    position:absolute; bottom:0; inset-inline:0; padding:14px;
    display:flex; gap:10px; align-items:center; justify-content:center;
    background:linear-gradient(transparent,rgba(5,7,11,.9));
  }
  button,select{
    font:inherit;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:9px;padding:9px 15px;cursor:pointer;
  }
  button:hover:not(:disabled),select:hover{border-color:#3a4557}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    border-color:#3f6fd0;font-weight:600;padding:10px 24px;
  }

  aside{
    background:var(--panel);border-inline-start:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .head{
    padding:14px 16px;border-bottom:1px solid var(--line);flex:none;
    display:flex;align-items:center;gap:10px;
  }
  .head .grow{flex:1;min-width:0}
  .head h2{margin:0;font-size:14px;font-weight:600}
  .head .sub{font-size:11px;color:var(--muted);margin-top:3px}
  button.mini{font-size:11px;padding:5px 10px;border-radius:7px;flex:none}
  button.mini.on{color:var(--accent);border-color:#3f6fd0;background:#121c2e}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);flex:none}
  .stat{background:var(--panel);padding:11px 8px;text-align:center}
  .stat .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .stat .k{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

  .list{flex:1;overflow-y:auto;padding:10px;min-height:0}
  .row{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;
  }
  .row .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .score{
    font-size:11px;font-weight:650;padding:2px 7px;border-radius:5px;
    font-variant-numeric:tabular-nums;
  }
  .score.hi{background:#102416;color:var(--ok)}
  .score.mid{background:#2a2310;color:var(--warn)}
  .score.lo{background:#2a1313;color:var(--bad)}
  .marks{font-size:10px;color:var(--muted)}
  .txt{font-size:21px;line-height:1.95;word-break:break-word}
  .txt.ar{font-family:"Traditional Arabic","Simplified Arabic",Tahoma,serif;font-size:25px}
  .empty{color:var(--muted);text-align:center;padding:34px 16px;font-size:13px;line-height:1.7}
  .note{
    margin:10px;padding:9px 11px;border-radius:9px;font-size:11px;line-height:1.6;
    background:#241c0c;border:1px solid #4a3a12;color:#e8cf95;
  }
  .foot{
    padding:9px 14px;border-top:1px solid var(--line);
    font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex:none;
  }
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <div>
    <div class="title">موشور الصوتيات · Phonics Prism</div>
    <div class="subtitle">قارئ النصوص العربية والإنجليزية — يعمل محليًا بدون إنترنت</div>
  </div>
  <div class="spacer"></div>
  <span class="badge on" id="offlineBadge">● محلي</span>
  <span class="badge" id="modelBadge">…</span>
</header>

<main>
  <section class="stage">
    <div class="viewport" id="viewport" hidden>
      <video id="video" autoplay playsinline muted></video>
      <img id="shot" alt="" hidden>
      <b class="k1"></b><b class="k2"></b><b class="k3"></b><b class="k4"></b>
    </div>
    <div class="hint" id="hint">اضغط «تشغيل الكاميرا» للبدء</div>
    <div class="hud" id="hud" hidden>
      <span class="chip" id="chipWin">A5</span>
      <span class="chip" id="chipRes">—</span>
      <span class="chip" id="chipSharp">—</span>
    </div>
    <div class="controls">
      <select id="lang" title="اللغة">
        <option value="ar">عربي</option>
        <option value="en">English</option>
        <option value="mixed">مختلط (تجريبي)</option>
      </select>
      <select id="cam" title="الكاميرا" hidden></select>
      <button id="win" class="on" title="اقصر البث على مقاس A5">نافذة A5</button>
      <button id="start">تشغيل الكاميرا</button>
      <button id="pick" title="اقرأ صورة من الجهاز">رفع صورة</button>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="snap" class="primary" disabled>التقاط وقراءة</button>
      <button id="again" hidden>رجوع للبث</button>
      <button id="stop" disabled>إيقاف</button>
    </div>
  </section>

  <aside>
    <div class="head">
      <div class="grow">
        <h2>النتيجة</h2>
        <div class="sub" id="resSub">لم يتم التقاط صورة بعد</div>
      </div>
      <button id="dia" class="mini" title="إخفاء الحركات من العرض فقط">بدون تشكيل</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="sLines">—</div><div class="k">سطور</div></div>
      <div class="stat"><div class="v" id="sMarks">—</div><div class="k">تشكيل</div></div>
      <div class="stat"><div class="v" id="sConf">—</div><div class="k">الثقة</div></div>
    </div>
    <div class="list" id="list">
      <div class="empty">
        وجّه الكاميرا إلى صفحة مطبوعة<br>ثم اضغط «التقاط وقراءة»
      </div>
    </div>
    <div class="foot">
      <span id="fTime">—</span>
      <span id="fModel">—</span>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const video=$('video'), shot=$('shot'), hint=$('hint'), hud=$('hud'), vp=$('viewport');
let stream=null, lastFrame=null, useWindow=true, hideDia=false;

// A5 portrait, 148 x 210 mm.
const A5_W_MM=148, A5_H_MM=210, A5_AR=A5_W_MM/A5_H_MM;

function setChip(el, text, cls){ el.textContent=text; el.className='chip'+(cls?' '+cls:''); }

// Crop rectangle in VIDEO pixel coordinates -- the same rectangle
// object-fit:cover shows in the viewport: the largest A5-shaped region
// that fits the sensor frame, centred. No margin is left over, so the
// crop uses the full sensor height on a landscape camera.
function cropRect(){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;
  if(!useWindow) return {x:0,y:0,w:vw,h:vh};
  let w, h;
  if(vw/vh > A5_AR){ h=vh; w=vh*A5_AR; } else { w=vw; h=vw/A5_AR; }
  w=Math.round(w); h=Math.round(h);
  return {x:Math.round((vw-w)/2), y:Math.round((vh-h)/2), w:w, h:h};
}

// Size the viewport in pixels so its shape matches the crop exactly.
function placeViewport(){
  const showing = stream || !shot.hidden;
  if(!showing){ vp.hidden=true; return; }
  const s=vp.parentElement.getBoundingClientRect();
  const availW=Math.max(80, s.width-32), availH=Math.max(80, s.height-96);
  // An upload keeps its own shape; only the live stream is cropped.
  const ar = (!stream || !shot.hidden)
    ? (shot.naturalWidth ? shot.naturalWidth/shot.naturalHeight : A5_AR)
    : (useWindow ? A5_AR
                 : (video.videoWidth ? video.videoWidth/video.videoHeight : 4/3));
  let h=availH, w=h*ar;
  if(w>availW){ w=availW; h=w/ar; }
  vp.style.width=Math.round(w)+'px';
  vp.style.height=Math.round(h)+'px';
  vp.hidden=false;
}
window.addEventListener('resize', placeViewport);

async function listCams(){
  try{
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    if(devs.length>1){
      $('cam').hidden=false; $('cam').innerHTML='';
      devs.forEach((d,i)=>{
        const o=document.createElement('option');
        o.value=d.deviceId; o.textContent=d.label||('كاميرا '+(i+1));
        $('cam').appendChild(o);
      });
    }
  }catch(e){}
}

async function start(){
  const id = $('cam').value;
  const constraints = { audio:false, video: id
      ? { deviceId:{exact:id}, width:{ideal:1920}, height:{ideal:1080} }
      : { facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} } };
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  }catch(e){
    hint.hidden=false;
    hint.innerHTML='تعذّر فتح الكاميرا<br><span style="font-size:12px">'+e.message+
      '</span><br><span style="font-size:12px;color:#8b97ab">تأكد من السماح للمتصفح باستخدام الكاميرا</span>';
    return;
  }
  video.srcObject=stream; video.hidden=false; shot.hidden=true;
  hint.hidden=true; hud.hidden=false; placeViewport();
  $('snap').disabled=false; $('stop').disabled=false; $('start').textContent='إعادة التشغيل';
  await listCams();
  video.onloadedmetadata=()=>{ showRes(); placeViewport(); };
  tick();
}

function showRes(){
  const c=cropRect(); if(!c) return;
  setChip($('chipWin'), useWindow ? 'A5 · 148 × 210 مم' : 'الإطار كامل',
          useWindow ? 'ok' : 'warn');
  setChip($('chipRes'), useWindow
    ? video.videoWidth+'×'+video.videoHeight+' → '+c.w+'×'+c.h
    : video.videoWidth+'×'+video.videoHeight);
}

function stop(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null; hud.hidden=true; vp.hidden=true;
  $('snap').disabled=true; $('stop').disabled=true;
  hint.hidden=false; hint.textContent='الكاميرا متوقفة';
}

// Live sharpness, measured with a Laplacian-style kernel on a small
// grayscale sample of the reading window -- the same pixels that will
// be sent, so the number means something. Measured on real captures:
// below ~150 the recogniser loses diacritics, so the chip warns before
// you shoot rather than after.
function tick(){
  if(!stream) return;
  const r=cropRect();
  if(r){
    placeViewport();
    const w=220,h=160,c=document.createElement('canvas');
    c.width=w;c.height=h;
    const g=c.getContext('2d',{willReadFrequently:true});
    g.drawImage(video, r.x,r.y,r.w,r.h, 0,0,w,h);
    const d=g.getImageData(0,0,w,h).data; const lum=new Float32Array(w*h);
    for(let i=0,p=0;i<d.length;i+=4,p++) lum[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    let sum=0,sum2=0,n=0;
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const i=y*w+x;
      const v=4*lum[i]-lum[i-1]-lum[i+1]-lum[i-w]-lum[i+w];
      sum+=v; sum2+=v*v; n++;
    }
    const varr=sum2/n-(sum/n)**2;
    const s=Math.round(varr);
    setChip($('chipSharp'),'وضوح '+s, s>=150?'ok':(s>=90?'warn':'bad'));
  }
  requestAnimationFrame(()=>setTimeout(tick,220));
}

// Capture only the reading window. Cropping here rather than on the
// server means the room behind the page never leaves the browser, and
// it raises the text-to-frame ratio into the band where detection
// actually works.
function grab(){
  const r=cropRect(); if(!r) return null;
  const c=document.createElement('canvas');
  c.width=r.w; c.height=r.h;
  c.getContext('2d').drawImage(video, r.x,r.y,r.w,r.h, 0,0,r.w,r.h);
  return c.toDataURL('image/jpeg',0.95);
}

async function snap(){
  if(!stream) return;
  const data=grab(); if(!data) return;
  await read(data);
}

// An uploaded file goes down the identical path: the server runs the
// same pipeline on whatever bytes arrive, so a given image scores the
// same whether it came from the camera or the disk. The only thing
// that changes is the image -- a steady scan is not a hand-held frame.
function upload(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // Uploads are not cropped to A5: the file is already framed.
      const c=document.createElement('canvas');
      c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      shot.src=c.toDataURL('image/png');
      shot.hidden=false; video.hidden=true; vp.hidden=false;
      // The camera prompt is still showing when nothing was started.
      hint.hidden=true;
      $('again').hidden=!stream;
      placeViewport();
      read(c.toDataURL('image/jpeg',0.95));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

async function read(data){
  lastFrame=data;
  $('snap').disabled=true; $('pick').disabled=true;
  $('resSub').textContent='جارٍ القراءة…';
  $('list').innerHTML='<div class="empty">جارٍ المعالجة…</div>';
  const t0=performance.now();
  let r;
  try{
    const res=await fetch('/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:data, lang:$('lang').value})});
    r=await res.json();
    if(!res.ok) throw new Error(r.error||('HTTP '+res.status));
  }catch(e){
    $('resSub').textContent='فشل';
    $('list').innerHTML='<div class="empty" style="color:#f06060">'+e.message+'</div>';
    $('snap').disabled=!stream; $('pick').disabled=false; return;
  }
  render(r, (performance.now()-t0)/1000);
  $('snap').disabled=!stream; $('pick').disabled=false;
}

// Display-only diacritic filter. The server keeps text_raw untouched
// and the saved JSON still carries every mark; this strips them from
// the panel for pages that were printed bare, where the fine-tune's
// guesses are noise rather than data.
const TASHKEEL=/[ً-ٰٟۖ-ۭ]/g;
const shown = t => hideDia ? t.replace(TASHKEEL,'') : t;

let lastResult=null, lastWall=0;

function render(r, wall){
  lastResult=r; lastWall=wall;
  if(r.overlay_jpeg_b64){
    shot.src='data:image/jpeg;base64,'+r.overlay_jpeg_b64;
    shot.hidden=false; video.hidden=true; $('again').hidden=false;
  }
  const regions=r.regions||[];
  const order=(r.reading_order&&r.reading_order.region_indices)||regions.map((_,i)=>i);
  const marks=regions.reduce((a,x)=>a+(x.tashkeel_count||0),0);
  const conf=regions.length? regions.reduce((a,x)=>a+x.rec_score,0)/regions.length : 0;

  $('sLines').textContent=regions.length;
  $('sMarks').textContent=marks;
  $('sConf').textContent=regions.length? conf.toFixed(2) : '—';
  $('resSub').textContent='لقطة '+(r.capture?r.capture.index:'—')+
     ' · '+(r.timing?r.timing.inference_seconds.toFixed(2):'?')+' ث';
  $('fTime').textContent='زمن كامل '+wall.toFixed(2)+' ث · '+(r.device_used||'');
  $('fModel').textContent=r.weights_used||'';

  const list=$('list'); list.innerHTML='';

  // One standing note instead of the per-capture warnings. The frame
  // hints and the invented-tashkeel caveat were both true, but they
  // fired on most captures and buried the result; the live sharpness
  // chip still shows frame quality before you shoot.
  const n=document.createElement('div'); n.className='note';
  n.textContent='النموذج لا يزال تحت التطوير.';
  list.appendChild(n);

  if(!regions.length){
    const e=document.createElement('div'); e.className='empty';
    e.innerHTML='لم يُعثر على نص.<br>قرّب الورقة لتملأ الإطار، وثبّتها موازية للكاميرا.';
    list.appendChild(e); return;
  }
  order.forEach(i=>{
    const g=regions[i]; if(!g) return;
    const row=document.createElement('div'); row.className='row';
    const meta=document.createElement('div'); meta.className='meta';
    const sc=document.createElement('span');
    sc.className='score '+(g.rec_score>=0.8?'hi':(g.rec_score>=0.6?'mid':'lo'));
    sc.textContent=g.rec_score.toFixed(2);
    const mk=document.createElement('span'); mk.className='marks';
    mk.textContent=(g.tashkeel_count&&!hideDia?('تشكيل '+g.tashkeel_count+' · '):'')+
      (g.dominant_script||'');
    meta.appendChild(sc); meta.appendChild(mk);
    const tx=document.createElement('div');
    tx.className='txt'+(g.dominant_script==='arabic'?' ar':'');
    tx.dir = g.dominant_script==='arabic' ? 'rtl':'ltr';
    tx.textContent=shown(g.text_raw);
    row.appendChild(meta); row.appendChild(tx); list.appendChild(row);
  });
}

$('start').onclick=start;
$('stop').onclick=stop;
$('snap').onclick=snap;
$('again').onclick=()=>{
  shot.hidden=true; video.hidden=false; $('again').hidden=true; placeViewport();
};
$('cam').onchange=start;
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{ upload(e.target.files[0]); e.target.value=''; };

$('win').onclick=()=>{
  useWindow=!useWindow;
  $('win').classList.toggle('on', useWindow);
  $('win').textContent = useWindow ? 'نافذة A5' : 'الإطار كامل';
  showRes(); placeViewport();
};

$('dia').onclick=()=>{
  hideDia=!hideDia;
  $('dia').classList.toggle('on', hideDia);
  $('dia').textContent = hideDia ? 'إظهار التشكيل' : 'بدون تشكيل';
  if(lastResult) render(lastResult, lastWall);
};

fetch('/api/info').then(r=>r.json()).then(d=>{
  const ar=(d.models||[]).find(m=>m.lang==='ar');
  $('modelBadge').textContent = ar && ar.finetuned ? 'نموذج مُدرَّب' : 'نموذج أساسي';
  if(ar&&ar.finetuned) $('modelBadge').className='badge on';
}).catch(()=>{});
</script>
</body>
</html>
